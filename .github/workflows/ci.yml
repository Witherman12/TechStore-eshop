name: TechStore CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Backend
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Run Unit & Integration Tests
        run: dotnet test --no-build --configuration Release --verbosity normal

  frontend-lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  e2e-tests:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: techstore_e2e
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Build Backend API
        run: dotnet build Backend/TechStore.Api/TechStore.Api.csproj --configuration Release

      - name: Start Backend API
        env:
          ASPNETCORE_ENVIRONMENT: E2E
          ASPNETCORE_URLS: http://localhost:5000
          ConnectionStrings__DefaultConnection: Server=127.0.0.1;Port=3306;Database=techstore_e2e;User=testuser;Password=testpass;
          Jwt__Key: CI_E2E_SuperSecret_JwtKey_2026_AtLeast32Chars!
          Jwt__Issuer: TechStore.Api
          Jwt__Audience: TechStore.Client
          Jwt__ExpiryMinutes: "60"
        run: |
          dotnet run --no-build --configuration Release --project Backend/TechStore.Api/TechStore.Api.csproj --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:5000/api/auth/me; then
              echo "Backend API is ready!"
              exit 0
            fi
            sleep 2
          done
          echo "Backend API failed to start in time:"
          cat api.log
          exit 1

      - name: Install Frontend dependencies
        working-directory: ./Frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: ./Frontend
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        working-directory: ./Frontend
        env:
          VITE_API_BASE_URL: http://localhost:5000/api
        run: npm run test:e2e